---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rag-manager
  name: data-source-manager
  namespace: rag-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-manager
  template:
    metadata:
      labels:
        app: rag-manager
      name: data-source-manager
      namespace: rag-manager
    spec:
      containers:
        - name: manager
          image: docker.io/fr33dman/thragg-datasource-manager:v0.0.1
          imagePullPolicy: Never
          env:
            - name: SERVER_PORT
              value: "8000"
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: rag-manager-db-app
                  key: port
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: rag-manager-db-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rag-manager-db-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rag-manager-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-manager-db-app
                  key: password
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: api
#            httpGet:
#              port: api
#              path: /api/v1
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: api
#            httpGet:
#              port: api
#              path: /api/v1
            periodSeconds: 20
            initialDelaySeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
