name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: k8s-runners
    container: golang:1.27.0-bookworm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run tests
        run: go test ./...

  lint:
    runs-on: k8s-runners
    container: golangci/golangci-lint:v2.13.2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run linters
        run: golangci-lint run

  build:
    needs: [test, lint]
    runs-on: k8s-runners
    container: quay.io/buildah/stable:v1.39.3
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build container image
        run: |
          buildah bud \
            --build-arg VERSION="${GITHUB_SHA}" \
            --build-arg COMMIT_HASH="${GITHUB_SHA}" \
            --build-arg DATETIME="$(date -u +%FT%TZ)" \
            --tag "go-template:pr-${{ github.event.pull_request.number }}" \
            --file ./build/Dockerfile .
